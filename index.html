<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Departure Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 420px;
        }
        h2 {
            text-align: center;
            color: #1e3d59;
            margin-bottom: 25px;
            font-size: 22px;
            margin-top: 0;
        }
        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .full-width {
            margin-bottom: 15px;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a5568;
        }
        input[type="time"], input[type="number"] {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input:focus {
            border-color: #3b82f6;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            background-color: #1e3d59;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #173047;
        }
        button.secondary {
            background-color: #64748b;
        }
        button.secondary:hover {
            background-color: #475569;
        }
        button.active-live {
            background-color: #16a34a;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .separator {
            margin: 25px 0 15px 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }
        #result {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            line-height: 1.5;
            min-height: 50px;
        }
        .success-text {
            color: #16a34a !important;
            font-size: 16px;
        }
        .output-text {
            color: #1e3d59 !important;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Work Clock Calculator</h2>
    
    <div class="row">
        <div class="form-group">
            <label for="firstIn">First Punch In:</label>
            <input type="time" id="firstIn" value="09:30">
        </div>
        <div class="form-group">
            <label for="lastIn">Last Punch In:</label>
            <input type="time" id="lastIn" value="13:30">
        </div>
    </div>

    <div class="form-group full-width">
        <label for="currentActive">Current Active Hours (Portal):</label>
        <input type="number" id="currentActive" step="0.01" value="5.5">
    </div>

    <div class="form-group full-width">
        <label for="desiredActive">Desired Active Hours Target:</label>
        <input type="number" id="desiredActive" step="0.01" value="8.5">
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="useSystemTime" checked onchange="toggleCustomTime()">
        <label for="useSystemTime">Use laptop's live time right now</label>
    </div>

    <div class="form-group full-width" id="customTimeFrame" style="display: none;">
        <label for="customTime">Simulate Current Time:</label>
        <input type="time" id="customTime">
    </div>

    <div class="btn-container">
        <button onclick="calculateLeaveTime()">Calculate Time</button>
        <button id="liveBtn" class="secondary" onclick="toggleLiveTracking()">Live Track: OFF</button>
    </div>

    <hr class="separator">

    <div id="result">Modify any field and click calculate</div>
</div>

<script>
    let liveInterval = null;

    // Set fallback simulate time to right now
    document.getElementById('customTime').value = new Date().toTimeString().substring(0,5);

    function toggleCustomTime() {
        const useSystem = document.getElementById('useSystemTime').checked;
        document.getElementById('customTimeFrame').style.display = useSystem ? 'none' : 'flex';
        if (!useSystem && liveInterval) {
            toggleLiveTracking(); // Turn off live tracking if using custom time
        }
    }

    function parseTimeToMinutes(timeStr) {
        const [hours, minutes] = timeStr.split(':').map(Number);
        return hours * 60 + minutes;
    }

    function formatMinutesToAmPm(totalMinutes) {
        let hours = Math.floor(totalMinutes / 60) % 24;
        const minutes = totalMinutes % 60;
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const minsStr = minutes < 10 ? '0' + minutes : minutes;
        return `${hours}:${minsStr} ${ampm}`;
    }

    function toggleLiveTracking() {
        const liveBtn = document.getElementById('liveBtn');
        const useSystem = document.getElementById('useSystemTime').checked;

        if (!useSystem) {
            alert("Live tracking only works when 'Use laptop's live time' is enabled.");
            return;
        }

        if (liveInterval) {
            clearInterval(liveInterval);
            liveInterval = null;
            liveBtn.innerText = "Live Track: OFF";
            liveBtn.className = "secondary";
        } else {
            calculateLeaveTime();
            liveInterval = setInterval(calculateLeaveTime, 60000); // refresh every minute
            liveBtn.innerText = "Live Track: ON";
            liveBtn.className = "active-live";
        }
    }

    function calculateLeaveTime() {
        const firstInStr = document.getElementById('firstIn').value;
        const lastInStr = document.getElementById('lastIn').value;
        const currentActive = parseFloat(document.getElementById('currentActive').value);
        const desiredActive = parseFloat(document.getElementById('desiredActive').value);
        const useSystemTime = document.getElementById('useSystemTime').checked;

        if (!firstInStr || !lastInStr || isNaN(currentActive) || isNaN(desiredActive)) {
            alert("Please make sure all input fields are filled correctly.");
            return;
        }

        const firstInMins = parseTimeToMinutes(firstInStr);
        const lastInMins = parseTimeToMinutes(lastInStr);
        
        let currentMins;
        if (useSystemTime) {
            const now = new Date();
            currentMins = now.getHours() * 60 + now.getMinutes();
        } else {
            currentMins = parseTimeToMinutes(document.getElementById('customTime').value);
        }

        const elapsedClockMins = lastInMins - firstInMins;
        const activeMins = Math.round(currentActive * 60);
        let breakGapMins = elapsedClockMins - activeMins;
        if (breakGapMins < 0) breakGapMins = 0;

        const targetShiftMins = Math.round(desiredActive * 60);
        const departureMins = firstInMins + targetShiftMins + breakGapMins;
        const remainingMins = departureMins - currentMins;
        const departureClockStr = formatMinutesToAmPm(departureMins);

        const resultEl = document.getElementById('result');

        if (remainingMins <= 0) {
            resultEl.innerHTML = `<span class="success-text">🎉 Shift Goal Met!<br>You were clear to leave at <strong>${departureClockStr}</strong>.</span>`;
        } else {
            const hrsLeft = Math.floor(remainingMins / 60);
            const minsLeft = remainingMins % 60;
            resultEl.innerHTML = `<span class="output-text">🚪 Leave Time: <strong>${departureClockStr}</strong><br><br>⏱️ Countdown: <strong>${hrsLeft}h ${minsLeft}m</strong> remaining</span>`;
        }
    }
</script>

</body>
</html>
