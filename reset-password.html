<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Shift Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#050505">
<style>
  :root {--bg-main:#050505; --card-bg:#0C0814; --primary:#00E5FF; --success:#00E5FF; --warning:#FFB020; --danger:#FF5C8A; --text-main:#F3EEFB; --text-sub:#A99DC4; --border:#2B1553; --amethyst:#3B0A6B; --primary-ink:#050505;}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 380px; background-color: var(--card-bg); border-radius: 16px; padding: 28px 24px; border: 1px solid var(--border); }
  h1 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }
  label { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; display: block; }
  input[type="password"] { width: 100%; padding: 13px 14px; font-size: 15px; border: 1px solid var(--border); border-radius: 10px; background-color: var(--bg-main); color: var(--text-main); outline: none; margin-bottom: 14px; font-family: inherit; }
  input:focus { border-color: var(--primary); }
  button { width: 100%; padding: 15px; font-size: 15px; font-weight: 700; background-color: var(--primary); color: #fff; border: none; border-radius: 12px; cursor: pointer; }
  button:disabled { opacity: 0.6; }
  #message { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg-error { color: var(--danger); } .msg-ok { color: var(--success); }

  html{color-scheme:dark}
  body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:radial-gradient(900px 520px at 15% -10%,rgba(59,10,107,.55),transparent 60%),radial-gradient(700px 480px at 100% 110%,rgba(0,229,255,.10),transparent 60%),#050505 fixed;}
  .card{background:linear-gradient(160deg,#160B28 0%,#0C0814 55%)!important;border:1px solid var(--border)!important;box-shadow:0 20px 60px -20px rgba(59,10,107,.7),0 0 0 1px rgba(0,229,255,.04)!important}
  input:focus,select:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(0,229,255,.18)}
  ::selection{background:rgba(0,229,255,.3)}
  @media (prefers-reduced-motion:no-preference){.card{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) backwards}@keyframes cardIn{from{opacity:0;transform:translateY(10px)}}}

  button.primary,.tab.active,.btn-apply{color:#050505!important;background:linear-gradient(135deg,#00E5FF,#7DF3FF)!important;box-shadow:0 8px 24px -8px rgba(0,229,255,.55)}
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button#btnReset{color:#050505;background:linear-gradient(135deg,#00E5FF,#7DF3FF);box-shadow:0 8px 24px -8px rgba(0,229,255,.55)}
  .tabs{border:1px solid var(--border)}
  .brand-mark{filter:drop-shadow(0 0 12px rgba(0,229,255,.6))}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <div class="sub">This link was sent to your email.</div>
  <form onsubmit="return handleReset(event)">
    <label>New Password</label>
    <input type="password" id="newPassword" minlength="6" required autocomplete="new-password">
    <button type="submit" id="btnReset">Update Password</button>
  </form>
  <div id="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ouqeqgmgwcdesezpitlo.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91cWVxZ21nd2NkZXNlenBpdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDk5NjAsImV4cCI6MjA5NTk4NTk2MH0.x-GI2NFVVKuw3_BBjVvFTWdk7MhBce1okeWdxTflgV4";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function setMessage(text, isError) {
    const el = document.getElementById('message');
    el.innerText = text;
    el.className = text ? (isError ? 'msg-error' : 'msg-ok') : '';
  }

  async function handleReset(e) {
    e.preventDefault();
    const btn = document.getElementById('btnReset');
    btn.disabled = true; setMessage('Updating…');
    const { error } = await sb.auth.updateUser({ password: document.getElementById('newPassword').value });
    if (error) { setMessage(error.message, true); btn.disabled = false; return false; }
    setMessage('Password updated — redirecting…', false);
    setTimeout(() => window.location.href = "tracker.html", 1200);
    return false;
  }
</script>
</body>
</html>
